<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS Teresina</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f2f2f2;text-align:center;padding:20px}
h1{color:#d32f2f;font-size:32px;margin-top:20px}
p{color:#555;margin:10px 0 20px}
.panico{background:#d32f2f;color:#fff;border:none;width:220px;height:220px;border-radius:50%;font-size:28px;font-weight:bold;cursor:pointer;box-shadow:0 10px 20px rgba(0,0,0,.3)}
.panico:active{transform:scale(.95)}
.botoes{margin-top:25px;display:flex;flex-direction:column;gap:12px;max-width:320px;margin-left:auto;margin-right:auto}
.botoes a{text-decoration:none;padding:15px;border-radius:12px;font-weight:bold;color:#fff}
.pm{background:#1565c0}
.samu{background:#2e7d32}
.bombeiros{background:#ef6c00}
</style>
</head>
<body>
<h1>🚨 SOS TERESINA</h1>
<p>Em caso de emergência, aperte o botão abaixo</p>
<button class="panico" onclick="panico()">BOTÃO<br>DE PÂNICO</button>
<p id="msg" style="font-weight:bold;color:#d32f2f"></p>
<div class="botoes">
<a class="pm" href="tel:190">👮 LIGAR PARA PM - 190</a>
<a class="samu" href="tel:192">🚑 LIGAR PARA SAMU - 192</a>
<a class="bombeiros" href="tel:193">🔥 LIGAR PARA BOMBEIROS - 193</a>
</div>
<script>
function panico(){
document.getElementById('msg').innerText="⚠️ ALERTA ENVIADO! Fique calma, ajuda está a caminho.";
if(navigator.vibrate) navigator.vibrate([500,200,500]);
alert("SOS ENVIADO! Ligue para 190 se estiver em perigo imediato.");
}
</script>
</body>
</html>
