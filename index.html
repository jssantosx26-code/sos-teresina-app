<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS Teresina</title>
<style>
body{margin:0;font-family:Arial;background:#f2f2f2;text-align:center}
header{background:#d60000;color:#fff;padding:25px 10px}
header h1{margin:0;font-size:32px}
header p{margin:5px 0 0}
.card{background:#fff;margin:15px;padding:20px;border-radius:15px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.btn{display:block;background:#d60000;color:#fff;text-decoration:none;padding:16px;border-radius:12px;font-size:20px;font-weight:bold;margin:10px 0}
.btn.blue{background:#007bff}
.btn.green{background:#25D366}
.btn.orange{background:#ff7b00}
input{padding:13px;width:85%;font-size:18px;border-radius:10px;border:1px solid #ccc;text-align:center}
.btnSalvar{padding:13px 25px;border:0;background:#25D366;color:#fff;font-size:17px;border-radius:10px;font-weight:bold}
#mapa{width:100%;height:300px;border:0;border-radius:12px;display:none;margin-top:10px}
small{color:#666}
</style>
</head>
<body>
<header>
<h1>🚨 SOS TERESINA</h1>
<p>Ajuda rápida em emergência</p>
</header>

<div class="card">
<a class="btn" href="tel:190">📞 POLÍCIA - 190</a>
<a class="btn orange" href="tel:193">🚒 BOMBEIROS - 193</a>
<a class="btn blue" href="tel:192">🚑 SAMU - 192</a>
</div>

<div class="card">
<h3>💬 Seu Contato de Emergência</h3>
<p>Cadastre o número de quem vai te ajudar:</p>
<input id="zap" placeholder="Ex: 86999999999" inputmode="numeric">
<br><br>
<button class="btnSalvar" onclick="salvarZap()">Salvar Número</button>
<p id="salvo" style="color:green;font-weight:bold"></p>
<a class="btn green" href="#" onclick="abrirZap();return false;">💬 WHATSAPP SOS</a>
</div>

<div class="card">
<h3>📍 Minha Localização</h3>
<p id="loc">Aperte para ver você no mapa</p>
<button onclick="pegarLoc()" style="padding:13px 20px;border-radius:10px;border:0;background:#111;color:#fff;font-size:16px">📍 Ver no Mapa</button>
<iframe id="mapa" loading="lazy"></iframe>
<a id="linkMapa" class="btn blue" style="display:none" href="#" target="_blank">Abrir no Google Maps</a>
<button id="btnEnviarLoc" onclick="enviarLocZap()" style="display:none;padding:16px;border:0;background:#25D366;color:#fff;font-size:18px;border-radius:12px;font-weight:bold;width:100%;margin-top:10px">📤 ENVIAR MINHA LOCALIZAÇÃO NO WHATSAPP</button>
</div>

<div class="card"><small>SOS Teresina 4.0 - Feito para ajudar</small></div>

<script>
let minhaLat = null, minhaLng = null;
function salvarZap(){
  let n = document.getElementById('zap').value.replace(/\D/g,'');
  if(n.length < 10){ alert('Coloque o DDD + número, ex: 86999999999'); return; }
  localStorage.setItem('meuZap', n);
  document.getElementById('salvo').innerText = '✅ Salvo! Número: ' + n;
}
function abrirZap(){
  let n = localStorage.getItem('meuZap');
  if(!n){ alert('Cadastre o número primeiro!'); return; }
  window.open('https://wa.me/55'+n+'?text='+encodeURIComponent('🚨 SOS! Preciso de ajuda! Me ajuda por favor!'), '_blank');
}
function pegarLoc(){
  document.getElementById('loc').innerText='Buscando sua localização...';
  navigator.geolocation.getCurrentPosition(p=>{
    minhaLat = p.coords.latitude; minhaLng = p.coords.longitude;
    let mapa = document.getElementById('mapa');
    mapa.src = 'https://maps.google.com/maps?q='+minhaLat+','+minhaLng+'&z=16&output=embed';
    mapa.style.display = 'block';
    let link = document.getElementById('linkMapa');
    link.href = 'https://maps.google.com/?q='+minhaLat+','+minhaLng;
    link.style.display = 'block';
    document.getElementById('btnEnviarLoc').style.display = 'block';
    document.getElementById('loc').innerHTML = '✅ Você está aqui! 👇';
  },()=>{document.getElementById('loc').innerText='Ative o GPS e tente de novo';},{enableHighAccuracy:true});
}
function enviarLocZap(){
  let n = localStorage.getItem('meuZap');
  if(!n){ alert('Cadastre o número primeiro lá em cima!'); return; }
  if(!minhaLat){ alert('Aperte Ver no Mapa primeiro!'); return; }
  let msg = '🚨 SOS TERESINA - PRECISO DE AJUDA!\n\nEstou aqui, me ajuda por favor:\nhttps://maps.google.com/?q='+minhaLat+','+minhaLng;
  window.open('https://wa.me/55'+n+'?text='+encodeURIComponent(msg), '_blank');
}
let salvo = localStorage.getItem('meuZap');
if(salvo){ document.getElementById('zap').value = salvo; document.getElementById('salvo').innerText = '✅ Número salvo: ' + salvo; }
</script>
</body>
</html>
