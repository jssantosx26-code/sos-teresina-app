<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SOS Teresina</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#F2F4F7;color:#111;padding-bottom:90px}
.top{background:#0B2A4A;color:#fff;padding:18px 16px 22px;border-radius:0 0 24px 24px}
.top-row{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:22px;letter-spacing:.5px}
.logo span{color:#FF3B30}
.badge{background:#FF3B30;color:#fff;font-size:11px;font-weight:800;padding:5px 9px;border-radius:20px}
.sub{opacity:.85;font-size:13px;margin-top:4px}
.loc{background:#fff;margin:14px 16px 0;padding:14px;border-radius:16px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.loc-icon{width:44px;height:44px;background:#E8F0FF;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.loc b{font-size:14px}
.loc p{font-size:12px;color:#666;margin-top:2px}
.loc button{margin-left:auto;background:#0B2A4A;color:#fff;border:0;padding:8px 10px;border-radius:10px;font-weight:700;font-size:12px}
.panic{margin:16px}
.panic button{width:100%;background:#FF1F2E;color:#fff;border:0;border-radius:20px;padding:20px 16px;box-shadow:0 10px 25px rgba(255,31,46,.35)}
.panic .big{font-size:24px;font-weight:900;letter-spacing:1px}
.panic .small{font-size:13px;opacity:.9;margin-top:4px}
.title{padding:2px 16px 10px;font-weight:800;font-size:16px}
.grid{padding:0 16px;display:grid;gap:12px}
.card{background:#fff;border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.05);cursor:pointer}
.card:active{transform:scale(.98)}
.icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.blue{background:#E3ECFF}.green{background:#DFF7E3}.orange{background:#FFEAD6}
.card h3{font-size:16px}
.card p{font-size:12px;color:#666;margin-top:3px;line-height:1.4}
.arrow{margin-left:auto;font-size:20px;color:#999}
.alert{background:#FFF3CD;border:1px solid #FFE69C;margin:16px;border-radius:14px;padding:12px;font-size:12px;line-height:1.5}
.alert b{color:#664D03}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:12px 0 18px;border-top:1px solid #eee;z-index:10}
.bottom div{text-align:center;font-size:11px;color:#888;cursor:pointer}
.bottom .active{color:#0B2A4A;font-weight:800}
.bottom i{display:block;font-size:22px;margin-bottom:2px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px;padding-bottom:30px;max-height:85vh;overflow:auto}
.sheet h2{font-size:20px;margin-bottom:6px}
.sheet p{font-size:13px;color:#555;line-height:1.5}
.bigbtn{width:100%;padding:15px;border:0;border-radius:14px;font-size:16px;font-weight:800;margin-top:14px;cursor:pointer}
.red{background:#FF1F2E;color:#fff}.dark{background:#0B2A4A;color:#fff}.light{background:#EEF2F7;color:#111}
.close{float:right;font-size:22px;cursor:pointer}
